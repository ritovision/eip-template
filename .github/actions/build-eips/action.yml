name: 'build-eips'

description: 'Template CI placeholder: fails closed until template build-eips support exists'

inputs:
  args:
    description: 'Command-line arguments that would be passed to build-eips'
    required: true

outputs:
  stdout:
    description: 'Never set; this placeholder always fails before running build-eips'
    value: ''

# Template CI is deliberately fail-closed. The template has no Build.toml and
# its workspace bootstrap is deferred pending future build-eips support, and
# ritovision/build-eips has not published any release. This action therefore
# downloads and executes nothing (no releases/latest, branch, or tag fallback).
# A future rollout may replace it with the reviewed, SHA-pinned source-build
# action used by EIPs/ERCs once the template carries a Build.toml.
runs:
  using: "composite"
  steps:
      - name: Template build-eips support is deferred
        shell: bash
        env:
          BUILD_EIPS_ARGS: ${{ inputs.args }}
        run: |
          echo "::error title=build-eips deferred::Template CI cannot run build-eips yet: the template has no Build.toml (bootstrap deferred) and ritovision/build-eips has no published release. Requested: build-eips $BUILD_EIPS_ARGS" >&2
          exit 1
